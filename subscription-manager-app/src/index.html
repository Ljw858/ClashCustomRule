<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订阅同步助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="window-shell">
      <header class="titlebar">
        <div class="titlebar-drag">
          <div class="app-brand">
            <div class="app-logo">T</div>
            <div class="app-title-group">
              <span class="app-title">订阅同步助手</span>
            </div>
          </div>
        </div>

        <div class="window-actions">
          <button id="minimizeWindowBtn" class="window-btn" type="button" aria-label="最小化">-</button>
          <button id="maximizeWindowBtn" class="window-btn" type="button" aria-label="最大化">□</button>
          <button id="closeWindowBtn" class="window-btn danger" type="button" aria-label="关闭">×</button>
        </div>
      </header>

      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-inner">
            <div class="sidebar-label">工作区</div>
            <nav class="nav-list">
              <button class="nav-item active" data-view="convert" type="button">
                <span class="nav-indicator"></span>
                <span>订阅转换</span>
              </button>
              <button class="nav-item" data-view="token" type="button">
                <span class="nav-indicator"></span>
                <span>Token 管理</span>
              </button>
              <button class="nav-item" data-view="settings" type="button">
                <span class="nav-indicator"></span>
                <span>高级设置</span>
              </button>
            </nav>
            <div class="sidebar-footnote version-text-inline" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding-right: 16px; box-sizing: border-box;">
              <span>v1.0.4</span>
              <button id="checkUpdateBtn" class="ghost-btn" style="padding: 4px 8px; font-size: 12px;" type="button">检查更新</button>
            </div>
          </div>
        </aside>

        <main class="content-area">
          <div class="content-wrap">
            <div class="view-stage">
              <div id="viewTransition" class="view-transition">
                <section id="convertView" class="view-panel active">
                  <div class="panel view-card">
                    <div class="view-header">
                      <div class="eyebrow">Subscription</div>
                      <h1>订阅转换</h1>
                      <p class="view-description">在此粘贴订阅链接，支持多条。</p>
                    </div>

                    <div id="convertInputState" class="convert-state active">
                      <label class="field">
                        <span>SUBSCRIPTION_URLS</span>
                        <textarea
                          id="subscriptionUrls"
                          rows="4"
                          placeholder="在此粘贴订阅链接，支持多条"
                        ></textarea>
                        <small>一行一个订阅链接。点击转换后会同步到 GitHub 并触发 workflow。</small>
                      </label>

                      <div class="action-row centered-actions">
                        <button id="syncAndRunBtn" class="primary-btn" type="button">一键订阅 / 转换</button>
                        <button id="saveBtn" class="secondary-btn" type="button">仅保存</button>
                      </div>
                    </div>

                    <div id="convertResultState" class="convert-state result-state">
                      <div class="result-state-header">
                        <div class="result-badge" id="resultBadge">已准备</div>
                        <h2 id="resultTitle">最终订阅地址</h2>
                        <p id="resultDescription" class="view-description">
                          转换成功后，这里会展示最终地址，便于复制和查看。
                        </p>
                      </div>

                      <label class="field">
                        <span>Gist Raw URL</span>
                        <div class="result-row">
                          <input id="gistRawUrl" type="text" readonly />
                          <button id="copyRawUrlBtn" class="secondary-btn" type="button">复制</button>
                        </div>
                        <small>客户端继续使用这个地址，后续换订阅时不需要改客户端。</small>
                      </label>

                      <div class="action-row centered-actions">
                        <button id="openRawUrlBtn" class="secondary-btn" type="button">查看最终订阅</button>
                        <button id="backToEditBtn" class="ghost-btn" type="button">返回编辑</button>
                      </div>
                    </div>
                  </div>
                </section>

                <section id="tokenView" class="view-panel" hidden>
                  <section id="tokenStatusShell" class="status-shell" style="display: none; max-width: 680px; margin: 0 auto 16px;">
                    <div id="statusBanner" class="status-banner idle">
                      <div class="status-icon" id="statusIcon">i</div>
                      <div class="status-copy">
                        <div id="statusTitle" class="status-title">准备就绪</div>
                        <div id="statusMessage" class="status-message">请选择左侧功能并开始操作。</div>
                      </div>
                    </div>
                  </section>
                  <div class="panel view-card narrow-card">
                    <div class="view-header">
                      <div class="eyebrow">Token</div>
                      <h1>Token 管理</h1>
                      <p class="view-description">只在这里管理 GitHub Token，和其他功能彻底分开。</p>
                    </div>

                    <label class="field">
                      <span>GitHub Token</span>
                      <div class="password-field">
                        <input id="githubToken" type="password" placeholder="输入后将保存在本地加密存储中" />
                        <button id="toggleTokenBtn" class="icon-btn" type="button" aria-label="显示或隐藏 Token">👁</button>
                      </div>
                      <small id="tokenSavedHint">当前未保存 Token。</small>
                    </label>

                    <div class="action-row centered-actions">
                      <button id="saveTokenBtn" class="primary-btn" type="button">保存 Token</button>
                      <button id="loadTokenBtn" class="secondary-btn" type="button">查看 Token</button>
                    </div>
                  </div>
                </section>

                <section id="settingsView" class="view-panel" hidden>
                  <div class="panel view-card">
                    <div class="view-header">
                      <div class="eyebrow">Settings</div>
                      <h1>高级设置</h1>
                      <p class="view-description">这是独立的系统设置面板，不再浮在主页里。</p>
                    </div>

                    <div class="settings-grid">
                      <label class="setting-row">
                        <span>仓库 Owner</span>
                        <input id="repoOwner" type="text" placeholder="Ljw858" />
                      </label>
                      <label class="setting-row">
                        <span>仓库名</span>
                        <input id="repoName" type="text" placeholder="ClashCustomRule" />
                      </label>
                      <label class="setting-row">
                        <span>分支</span>
                        <input id="branch" type="text" placeholder="master" />
                      </label>
                      <label class="setting-row">
                        <span>Workflow 文件</span>
                        <input id="workflowFile" type="text" placeholder="publish-config.yml" />
                      </label>
                    </div>

                    <div class="action-row settings-actions">
                      <button id="openSecretPageBtn" class="secondary-btn" type="button">打开 Secrets 页面</button>
                      <button id="openWorkflowPageBtn" class="secondary-btn" type="button">打开 Actions 页面</button>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>
        </main>
      </div>

      <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
